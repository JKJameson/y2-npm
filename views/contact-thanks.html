        <meta charset="UTF-8">

        <link rel="preload" href="fonts/NotoSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="fonts/Bungee-Regular.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="css/style.css">
        <script src="js/site.js"></script>
    </head>
    <body>
        <!-- Header Section -->
        <header>
            <a href="index.html"><img src="images/logo.svg" id="logo" alt="StockIntro" width="160" height="40"></a>
            <div id="navfocus" onClick="toggleNavMenu()"><!-- Shows a gray background when small menu is toggled to focus the nav menu --></div>
            <nav>
                <!-- Navigation Section -->
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="basics.html">Basics</a></li>
                    <li><a href="how-to.html">How-To</a></li>
                    <li><a href="concepts.html">Concepts</a></li>
                    <li><a href="risks.html">Risks</a></li>
                    <li><a href="resources.html">Resources</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
            <span id="hamburger" onClick="toggleNavMenu()">&#8801;</span>
        </header>
        <main>
            <section class="content">
                <h1>Message Sent</h1>
                <p>Thanks for getting in touch! We'll get back to you as soon as we can.</p>
                <p>Here is a summary of what you submitted:</p>
                <div id="submitted-values" style="margin-top:16px; background:var(--bg-color); border:1px solid var(--border-color); border-radius:8px; padding:16px;">
                </div>
                <p style="margin-top:16px;"><a href="about.html" style="color:var(--accent-primary);">&#8592; Back to the contact form</a></p>
            </section>
        </main>
        <script>
            (function () {
                var params = new URLSearchParams(window.location.search);
                var container = document.getElementById('submitted-values');
                var labels = { name: 'Name', email: 'Email', message: 'Message' };
                var html = '<dl style="display:flex;flex-direction:column;gap:12px;">';
                var found = false;
                params.forEach(function (value, key) {
                    found = true;
                    var label = labels[key] || key;
                    html += '<div><dt style="font-weight:bold;color:var(--text-primary);">' + label + '</dt>'
                          + '<dd style="margin-left:0;color:var(--text-secondary);">' + value + '</dd></div>';
                });
                html += '</dl>';
                if (found) {
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="color:var(--text-secondary);">No form data found.</p>';
                }
            })();
        </script>

                <li><a href="terms.html">Terms</a></li>

                <li><a href="#"><img src="images/icons/twitter-1-svgrepo-com.svg" class="icon-24" alt="Twitter / X"></a></li>
            </ul>
        </footer>
    </body>
</html>
